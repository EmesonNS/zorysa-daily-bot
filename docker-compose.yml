services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zorysa_daily}
      POSTGRES_USER: ${POSTGRES_USER:-zorysa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  bot:
    restart: unless-stopped
    build:
      context: .
    environment:
      APP_NAME: ${APP_NAME:-Zorysa Daily Bot}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_TOKEN: ${DISCORD_TOKEN:?DISCORD_TOKEN is required}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TIMEZONE: ${TIMEZONE:-America/Belem}
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && exec python -m app.main"]

volumes:
  postgres_data:
